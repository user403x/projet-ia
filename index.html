<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelvetiaTax IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* Plan : outil de pré-clôture sobre, grille suisse. Fond gris froid, surfaces blanches, encre bleu nuit ; le rouge suisse est réservé au logo et aux alertes critiques. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#141A22; --muted:#5A6573; --line:#DCE1E7;
  --accent:#1D3B5C; --accent-soft:#E6EDF5; --accent-ink:#FFFFFF;
  --swiss:#D52B1E; --brand-blue:#1A4FA0; --brand-navy:#13254F; --ok:#2F6B4F; --ok-soft:#E5F1EA; --warn:#8A5A00; --warn-soft:#FBF1DC; --crit:#A3241A; --crit-soft:#F8E5E3;
  --display:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#161C23; --surface-2:#1B222B; --ink:#E8ECF1; --muted:#9AA5B2; --line:#2A333E;
  --accent:#8FB3DA; --accent-soft:#1E2B3A; --accent-ink:#0F1419; --brand-blue:#6FA8F0; --brand-navy:#E8ECF1;
  --ok:#7CC39E; --ok-soft:#16281F; --warn:#E3B45C; --warn-soft:#2B2414; --crit:#F08A80; --crit-soft:#2E1A18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#161C23; --surface-2:#1B222B; --ink:#E8ECF1; --muted:#9AA5B2; --line:#2A333E;
  --accent:#8FB3DA; --accent-soft:#1E2B3A; --accent-ink:#0F1419; --brand-blue:#6FA8F0; --brand-navy:#E8ECF1;
  --ok:#7CC39E; --ok-soft:#16281F; --warn:#E3B45C; --warn-soft:#2B2414; --crit:#F08A80; --crit-soft:#2E1A18; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.flag{width:26px;height:30px;flex:none;display:block}
.brand b{color:var(--brand-navy);font-family:var(--display);font-size:1.12rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.8rem;display:block;line-height:1.1}
.ia{font-style:normal;color:var(--brand-blue)}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;transition:opacity .5s ease,visibility .5s}
.splash.out{opacity:0;visibility:hidden}
.splash-in{display:grid;justify-items:center;gap:18px;text-align:center}
.splash .flag{width:64px;height:73px}
.splash h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;letter-spacing:-.025em;color:var(--brand-navy);line-height:1}
.splash .slogan{font-family:var(--display);font-size:clamp(1rem,2.6vw,1.45rem);font-weight:500;color:var(--brand-navy);opacity:.9}
.splash .sub{color:var(--muted);font-size:.9rem}
.splash .btn{margin-top:8px;padding:10px 22px}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* stepper */
.steps{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:0;overflow-x:auto}
.step{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:11px 12px 12px;border:0;background:none;cursor:pointer;text-align:left;border-bottom:3px solid transparent;color:var(--muted)}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none;font-family:var(--display)}
.step b{display:block;font-size:.88rem;color:inherit;font-weight:600}
.step small{display:block;font-size:.74rem}
.step.on{color:var(--ink);border-bottom-color:var(--accent)}
.step.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done .n{border-color:var(--ok);color:var(--ok)}
.step:disabled{cursor:not-allowed;opacity:.55}
main{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:grid;gap:18px}
main > *,.grid > *,.card{min-width:0}
.lead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lead p{color:var(--muted);max-width:68ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card > .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card > .bd{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:.84rem;color:var(--muted)}
label.f > span{display:flex;justify-content:space-between;gap:8px}
label.f em{font-style:normal;font-size:.72rem;color:var(--muted);opacity:.85}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;color:var(--ink)}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:70px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
.banner{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 13px;border-radius:var(--r);font-size:.88rem}
.banner.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.banner.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.nopiece td{background:var(--warn-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-crit{color:var(--crit);background:var(--crit-soft)} .p-neutral{color:var(--muted);background:var(--surface-2);border-color:var(--line)} .p-acc{color:var(--accent);background:var(--accent-soft)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tile small{color:var(--muted);font-size:.78rem;display:block}
.tile b{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.tile i{font-style:normal;font-size:.78rem;color:var(--muted)}
/* checks */
.checks{display:grid;gap:0}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.crit{background:var(--crit-soft);color:var(--crit)}
/* agents */
.agent{display:grid;grid-template-columns:minmax(180px,260px) 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.agent:last-child{border-bottom:0}
@media (max-width:620px){.agent{grid-template-columns:1fr auto}.agent .bar{grid-column:1/-1}}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}
.bar.paused > i{background:var(--warn)}
.bar.done > i{background:var(--ok)}
.logbox{font-family:var(--mono);font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;max-height:240px;overflow:auto;white-space:pre-wrap}
/* fiches */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--line)}
.fiche.r-faible{border-left-color:var(--ok)} .fiche.r-moyen{border-left-color:var(--warn)} .fiche.r-eleve{border-left-color:var(--crit)}
.fiche .fh{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;cursor:pointer;align-items:center}
.fiche .right{display:flex;align-items:center;gap:14px}
.stamp{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:5px 11px;font-size:.8rem;font-weight:700;white-space:nowrap;letter-spacing:.01em;border:1.5px solid transparent;font-family:var(--display)}
.stamp.s-validee{background:var(--ok);color:#fff}
.stamp.s-ajustee{background:var(--accent);color:var(--accent-ink)}
.stamp.s-rejetee{background:var(--crit);color:#fff}
.stamp.s-proposee{background:transparent;color:var(--muted);border-color:var(--line);border-style:dashed}
:root[data-theme="dark"] .stamp.s-validee,:root[data-theme="dark"] .stamp.s-rejetee{color:#0F1419}
.fiche.st-validee,.fiche.st-ajustee{background:linear-gradient(90deg,var(--ok-soft),var(--surface) 55%)}
.fiche.st-rejetee{opacity:.72}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;display:grid;gap:8px}
.pbar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.pbar .pv{background:var(--ok);transition:width .3s} .pbar .pr{background:var(--crit);opacity:.75;transition:width .3s}
.zone{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--surface-2)}
.zone.zone-ok{border-color:var(--ok);border-width:1.5px;background:var(--ok-soft)}
.zone-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line)}
.fiche.flash{animation:fl 1.2s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:620px){.fiche .right{flex-direction:column-reverse;align-items:flex-end;gap:6px}}
.fiche .fh h3{font-size:.98rem}
.fiche .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.gain{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1rem;white-space:nowrap}
.gain small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
.gain.neg{color:var(--crit)}
.fiche .fb{border-top:1px solid var(--line);padding:14px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.ref{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:2px 8px;font-size:.78rem;cursor:pointer;font-weight:500;color:var(--accent)}
.ref.ext{color:var(--muted);cursor:help}
.ref:hover{border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.aibox{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:11px 13px;font-size:.9rem;white-space:pre-wrap}
.aibox.none{border-color:var(--warn);background:var(--warn-soft)}
/* results */
.bars{display:grid;gap:5px}
.brow{display:grid;grid-template-columns:150px 1fr 104px 92px;gap:10px;align-items:center;font-size:.84rem}
@media (max-width:620px){.brow{grid-template-columns:96px 1fr 84px}.brow .d{display:none}}
.brow .track{height:14px;background:var(--surface-2);border-radius:3px;position:relative}
.brow .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.35;border-radius:3px}
.brow.base .track i{opacity:1}
.brow.base{font-weight:600}
.brow .d.neg{color:var(--ok)} .brow .d.pos{color:var(--crit)}
/* modal & drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:none}
.scrim.on{display:block}
.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 28px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.on{display:block}
.modal .hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.modal .bd{padding:16px 18px;display:grid;gap:12px}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.drawer{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.drawer.on{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer .bd{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.drawer .ft{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.msg{border-radius:var(--r);padding:10px 12px;font-size:.9rem;white-space:pre-wrap}
.msg.u{background:var(--accent-soft);justify-self:end;max-width:88%}
.msg.a{background:var(--surface-2);border:1px solid var(--line)}
.qbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.qbox b{font-family:var(--display)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:3px}
.kbhit{border-bottom:1px solid var(--line);padding:9px 0;font-size:.86rem}
.kbhit b{color:var(--accent)}
.kbhit p{color:var(--muted);white-space:pre-wrap;max-height:6.2em;overflow:hidden}
.src-text{white-space:pre-wrap;font-size:.86rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:55vh;overflow:auto}
.foot{max-width:1240px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.78rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
.sec-title{display:flex;align-items:baseline;gap:10px}
.sec-title .ix{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-label="Bienvenue">
  <div class="splash-in">
    <svg class="flag" viewBox="0 0 60 68" aria-hidden="true"><path d="M4 4h52v28c0 18-12 28-26 32C16 60 4 50 4 32z" fill="#D52B1E"/><g fill="#fff"><rect x="25" y="12" width="10" height="11" rx="1.5"/><rect x="25" y="37" width="10" height="11" rx="1.5"/><rect x="11" y="25" width="11" height="10" rx="1.5"/><rect x="38" y="25" width="11" height="10" rx="1.5"/><rect x="25.5" y="25.5" width="9" height="9" rx="1.5"/></g></svg>
    <h1>HelvetiaTax <em class="ia">IA</em></h1>
    <p class="slogan">Think Smart. Tax Smarter. Trust HelvetiaTax <em class="ia">IA</em>.</p>
    <p class="sub">Copilote fiscal de pré-clôture pour PME suisses</p>
    <button class="btn primary" id="enter" type="button">Commencer</button>
  </div>
</div>
<header class="top">
  <div class="top-in">
    <div class="brand"><svg class="flag" viewBox="0 0 60 68" aria-hidden="true"><path d="M4 4h52v28c0 18-12 28-26 32C16 60 4 50 4 32z" fill="#D52B1E"/><g fill="#fff"><rect x="25" y="12" width="10" height="11" rx="1.5"/><rect x="25" y="37" width="10" height="11" rx="1.5"/><rect x="11" y="25" width="11" height="10" rx="1.5"/><rect x="38" y="25" width="11" height="10" rx="1.5"/><rect x="25.5" y="25.5" width="9" height="9" rx="1.5"/></g></svg><div><b>HelvetiaTax <em class="ia">IA</em></b><span>Copilote fiscal de pré-clôture · PME suisses</span></div></div>
    <span class="chip" id="chipDossier">Dossier <b>—</b></span>
    <span class="chip" id="chipCanton">Canton <b>—</b></span>
    <span class="chip" id="chipAI">IA <b>…</b></span>
    <button class="btn sm" id="btnKB" type="button">Base juridique</button>
    <button class="btn sm primary" id="btnChat" type="button">Assistant IA</button>
  </div>
  <nav class="steps" id="steps" aria-label="Étapes"></nav>
</header>

<main id="view"></main>
<div class="foot" id="foot"></div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>

<aside class="drawer" id="drawer" aria-label="Assistant HelvetiaTax">
  <div class="hd"><div><h3>Assistant HelvetiaTax</h3><div class="hint">Répond uniquement avec des sources de la base</div></div><button class="btn sm" id="closeChat" type="button">Fermer</button></div>
  <div class="bd" id="chatLog"></div>
  <div class="ft">

}

/* ================== ORCHESTRATION ================== */
async function startAnalysis(){
  S.fiches=[]; S.ecartees=[]; S.log=[]; FID=0;
  S.run = { state:"running", agents: AGENTS.filter(a=>!a.when||a.when(S.d)).map(a=>({id:a.id,name:a.name,p:0,st:"attente",n:0})).concat([{id:"revue",name:"Revue IA des écritures",p:0,st:"attente",n:0},{id:"controleur",name:"Agent contrôleur",p:0,st:"attente",n:0}]), idx:0, pending:null };
  audit("Moteur","Analyse lancée",`${S.d.nom} · ${S.d.canton} · ${S.d.exercice}`);
  log(`Orchestrateur : profil ${S.d.forme} ${S.d.canton}, TVA ${S.d.tva?"oui":"non"} → ${S.run.agents.length} agents`);
  render(); await continueRun();
}
async function continueRun(){
  const R=S.run; if(!R) return;
  R.state="running"; render();
  while(R.idx<R.agents.length){
    const A=R.agents[R.idx]; A.st="en cours";
    for(let p=10;p<=80;p+=35){ A.p=p; paintRun(); await sleep(170); }
    if(A.id==="revue"){ await runAIReview(A); if(R.state==="paused") return; }
    else if(A.id==="controleur"){ runController(A); }
    else {
      const ag=AGENTS.find(x=>x.id===A.id); const {F,Q}=ag.run(S.d);
      S.fiches=S.fiches.filter(f=>f.agent!==A.id).concat(F); A.n=F.length;
      log(`${A.name} : ${F.length} fiche(s)${Q.length?`, ${Q.length} question(s) pour l’expert`:""}`);
      if(Q.length){ A.st="en pause"; A.p=85; R.state="paused"; R.pending=Q[0]; paintRun(); audit("Moteur","Analyse suspendue – question à l’expert",Q[0].titre); openQuestion(Q[0]); return; }
    }
    A.p=100; A.st="terminé"; R.idx++; paintRun();
  }
  R.state="done"; S.maxStep=Math.max(S.maxStep,4);
  S.fiches.sort((a,b)=>gainOf(b).total-gainOf(a).total || rk(b.risque)-rk(a.risque));
  log(`Analyse terminée : ${S.fiches.length} fiches, ${S.ecartees.length} écartée(s) faute de base légale`);
  audit("Moteur","Analyse terminée",`${S.fiches.length} fiches`);
  render();
}
const rk = r => ({faible:1,moyen:2,eleve:3}[r]||0);
function runController(A){
  const keep=[], seen=new Set();
  for(const f of S.fiches){
    const okRefs=f.refs.filter(refExists);
    if(!okRefs.length){ S.ecartees.push({...f,motif:`Aucune base légale retrouvée dans la base (${f.refs.join(", ")})`}); log(`Contrôleur : « ${f.titre} » écartée, source absente de la base`); continue; }
    f.refs=okRefs;
    const key=f.titre+"|"+f.montant; if(seen.has(key)){ log(`Contrôleur : doublon supprimé « ${f.titre} »`); continue; } seen.add(key);
    keep.push(f);
  }
  S.fiches=keep; A.n=keep.length; log(`Contrôleur : ${keep.length} fiches conservées, chaque fiche a une pièce, un article et un calcul`);
}

/* ---------- Revue IA (pseudonymisée) ---------- */
async function runAIReview(A){
  const covered=new Set(); S.fiches.forEach(f=>(f.pieces||[]).forEach(p=>{ const m=String(p).match(/2026-\d{4}/); if(m) covered.add(m[0]); }));
  S.d.journal.filter(e=>e.tag).forEach(e=>covered.add(e.no));
  const rest=S.d.journal.filter(e=>!covered.has(e.no) && /^[5-8]/.test(e.debit));
  const already=S.run.aiQ||[];
  if(already.length){ // questions IA déjà posées : traiter les réponses
    S.fiches=S.fiches.filter(f=>f.agent!=="revue");
    for(const q of already){ const a=S.answers[q.id]; if(!a){ S.run.state="paused"; S.run.pending=q; A.st="en pause"; paintRun(); openQuestion(q); return; }
      if(a.v==="prive"||a.v==="partiel"){ const e=S.d.journal.find(x=>x.no===q.no); S.fiches.push(mk({agent:"revue",impot:"IFD + ICC",kind:"reprise",titre:`Reprise après revue IA : ${e.libelle}`,constat:`Signalée par la revue IA (${q.motif}). Réponse de l’expert : ${a.v==="prive"?"privé":"usage mixte, 50 %"}.`,pieces:[`${e.no} · ${e.piece||"sans pièce"}`],ecriture:{d:"1150",c:e.debit},montant:a.v==="prive"?e.montant:e.montant/2,refs:q.refs,risque:"moyen",urgence:"Avant clôture",expert:true})); }
    }
    A.n=already.length; return;
  }
  if(REMOTE && !getCode()){ log("Revue IA : code d’accès non saisi → analyse déterministe seule"); A.n=0; return; }
  await ensureAI();
  if(!AI){ log("Revue IA : inactive (page ouverte sans compte Claude connecté) → analyse déterministe seule"); A.n=0; return; }
  if(!rest.length){ log("Revue IA : aucune écriture non couverte"); return; }
  const pm=pseudoMap();
  const lines=rest.map(e=>`${e.no} | ${e.date} | D ${e.debit} ${ACCOUNTS[e.debit]||""} / C ${e.credit} | CHF ${e.montant} | ${pseudo(e.libelle,pm)} | pièce: ${e.piece||"AUCUNE"} | tiers: ${pm[e.tiers]||"—"}`).join("\n");
  const ex=["LIFD art. 58","LIFD art. 59","LTVA art. 31"].map(kbByRef).filter(Boolean);
  const src=ex.map((c,i)=>`[S${i+1}] ${c.ref}\n${c.text.slice(0,1400)}`).join("\n\n");
  log(`Revue IA : envoi de ${rest.length} écritures pseudonymisées (${Object.keys(pm).length} tiers remplacés par des identifiants)`);
  const prompt=`Tu es l'agent « Revue des écritures » de HelvetiaTax IA (pré-clôture, PME ${S.d.forme}, canton ${S.d.canton}, exercice ${S.d.exercice}).
Tâche : parmi les écritures ci-dessous (données pseudonymisées), signale au plus 3 écritures dont le caractère commercial est DOUTEUX (dépense possiblement privée, sans pièce, ou sans lien évident avec l'activité de conseil).
Contraintes : n'utilise QUE les extraits [S1..S${ex.length}] comme base légale ; ne calcule aucun impôt ; si rien n'est douteux, renvoie [].
Réponds uniquement par un tableau JSON : [{"no":"2026-xxxx","motif":"…(une phrase)","question":"question précise à poser à l'expert","sources":["S1"]}]

ÉCRITURES :
${lines}

EXTRAITS :
${src}`;
  try{
    const out=await AI.json(prompt,{modelTier:"default"});
    const valid=(Array.isArray(out)?out:[]).filter(o=>o&&rest.some(e=>e.no===o.no)&&Array.isArray(o.sources)&&o.sources.some(s=>/^S\d+$/.test(s)&&ex[+s.slice(1)-1])).slice(0,3);
    const rejected=(Array.isArray(out)?out.length:0)-valid.length;
    if(rejected>0) log(`Revue IA : ${rejected} signalement(s) rejeté(s) faute de source valide`);
    S.run.aiQ=valid.map(o=>{ const e=rest.find(x=>x.no===o.no); return {id:"QAI_"+o.no,no:o.no,agent:"revue",ai:true,motif:o.motif,titre:"Doute signalé par la revue IA",texte:`${e.no} « ${e.libelle} » (CHF ${chf(e.montant)}). ${o.motif}\n\nQuestion de l’IA : ${o.question}`,refs:o.sources.map(s=>ex[+s.slice(1)-1]?.ref).filter(Boolean),options:[["commercial","Justifié par l’usage commercial"],["prive","Dépense privée : à reprendre"],["partiel","Mixte : reprendre 50 %"]]}; });
    log(`Revue IA : ${S.run.aiQ.length} doute(s) → questions à l’expert`); audit("IA","Revue des écritures",`${S.run.aiQ.length} doute(s)`);
    if(S.run.aiQ.length) return runAIReview(A);
  }catch(e){ log(`Revue IA : ${errText(e)} → analyse déterministe seule`); if(e.code==="not_granted"||e.code==="sampling_disabled") AI=null; }
}
function pseudo(s,pm){ let o=s; Object.keys(pm).forEach(n=>{ o=o.split(n).join(pm[n]); const last=n.split(" ").pop(); if(last.length>3) o=o.split(last).join(pm[n]); }); return o; }
function errText(e){ if(e&&e.code==="bad_code"){ setTimeout(()=>askCode("Code d’accès manquant ou incorrect. Saisissez le bon code."),50); } return ({bad_code:"code d’accès manquant ou incorrect",empty_completion:"réponse vide, réessayez",not_granted:"accès à Claude refusé",rate_limited:"trop de requêtes, réessayez plus tard",sampling_disabled:"Claude indisponible pour ce compte",invalid_json:"réponse illisible",cancelled:"arrêté",session_expired:"session expirée"})[e?.code]||"erreur temporaire"; }

/* ================== QUESTIONS À L'EXPERT ================== */
function openQuestion(q){
  const refs=(q.refs||[]).map(refChip).join("");
  showModal(`<div class="hd"><div><span class="pill p-warn">Analyse suspendue</span><h2 id="modalTitle" style="margin-top:8px">${esc(q.titre)}</h2></div></div>
  <div class="bd"><p style="white-space:pre-wrap">${esc(q.texte)}</p>${refs?`<div><div class="hint" style="margin-bottom:5px">Base légale</div><div class="refs">${refs}</div></div>`:""}

const REMOTE = (window.HTX_CONFIG && window.HTX_CONFIG.apiUrl) ? window.HTX_CONFIG.apiUrl : null;
const getCode = () => { try{ return localStorage.getItem("htx-code")||""; }catch(e){ return ""; } };
function makeRemoteAI(url){
  const call = async (input, opts={}) => {
    const messages = typeof input==="string" ? [{role:"user",content:input}] : input;
    let r;
    try{ r = await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-access-code":getCode()},body:JSON.stringify({messages}),signal:opts.signal}); }
    catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}; }
    if(r.status===401) throw {code:"bad_code"};
    if(r.status===429) throw {code:"rate_limited"};
    if(!r.ok) throw {code:"upstream_error"};
    const j = await r.json(); const text = j.text||"";
    if(!text.trim()) throw {code:"empty_completion"};
    if(opts.onText) opts.onText({text,delta:text});
    return {text, truncated:!!j.truncated};
  };
  call.json = async (input, opts={}) => {
    const {text} = await call(input+"\n\nRéponds uniquement avec la valeur JSON demandée, sans aucun texte autour.", opts);
    const m = text.match(/[\[{][\s\S]*[\]}]/);
    try{ return JSON.parse(m?m[0]:text); }catch(e){ throw {code:"invalid_json",text}; }
  };
  return call;
}

const RULES = `Tu es HelvetiaTax IA, copilote fiscal de pré-clôture pour PME suisses, au service d'un expert fiscal ou comptable.
Règles impératives :
1. Réponds UNIQUEMENT à partir des extraits numérotés [S1], [S2]… fournis. Chaque affirmation juridique, taux ou montant doit citer son extrait entre crochets, ex. [S2].
2. Si les extraits ne permettent pas de répondre, écris exactement AUCUNE_SOURCE sur la première ligne, puis en une phrase le document qui manque. N'invente rien.
3. Ne calcule jamais toi-même un impôt : reprends seulement les montants fournis par le moteur.
4. Si un point dépend d'un fait que tu ne connais pas, termine par une ligne commençant par QUESTION_EXPERT: suivie de la question à poser.
5. Optimisation légale uniquement ; signale tout risque de prestation appréciable en argent ou d'évasion fiscale.

function sourcesBlock(list){ return list.map((c,i)=>`[S${i+1}] ${c.ref}${c.src&&c.type!=="loi"?` (${c.src})`:""}\n${c.text.slice(0,1500)}`).join("\n\n"); }
function renderAI(text, list){
  const t=text.trim();
  if(/^AUCUNE_SOURCE/.test(t)) return {html:`<div class="aibox none"><b>Pas de réponse : aucune source dans la base.</b>\n${esc(t.replace(/^AUCUNE_SOURCE\s*/,""))}</div>`, ok:false};
  const used=[...new Set([...t.matchAll(/\[S(\d+)\]/g)].map(m=>+m[1]))].filter(n=>list[n-1]);
  if(!used.length) return {html:`<div class="aibox none"><b>Réponse bloquée : l’IA n’a cité aucune source.</b> HelvetiaTax n’affiche pas de réponse non sourcée.</div>`, ok:false};
  let body=esc(t).replace(/\[S(\d+)\]/g,(m,n)=>list[n-1]?`<button class="ref" data-ref="${esc(list[n-1].ref)}" data-id="${esc(list[n-1].id)}" type="button">${esc(list[n-1].ref)}</button>`:"");
  body=body.replace(/QUESTION_EXPERT:\s*(.*)/,`</div><div class="qbox"><b>Question de l’IA à l’expert</b><span>$1</span></div><div>`);
  return {html:`<div class="aibox">${body}</div>`, ok:true, used};
}

  </tbody></table></div></section>
  <div class="row"><button class="btn" id="back1" type="button">Retour au cadrage</button><span class="spacer"></span><button class="btn primary" id="go" type="button" ${blocking?"disabled":""}>Lancer l’analyse fiscale</button></div>`;

function ficheCard(f){
  const g=gainOf(f), open=S.open[f.id];

  const risk={faible:["Risque faible","p-ok"],moyen:["Risque moyen","p-warn"],eleve:["Risque élevé","p-crit"]}[f.risque];

  return `<article class="fiche r-${f.risque} st-${f.statut}" id="card-${f.id}">
  <div class="fh" data-tog="${f.id}" role="button" tabindex="0" aria-expanded="${!!open}"><div><h3>${esc(f.titre)}</h3><div class="meta"><span class="pill p-neutral">${esc(f.impot)}</span><span class="pill ${risk[1]}">${risk[0]}</span><span class="pill p-neutral">${esc(f.urgence)}</span>${f.expert?`<span class="pill p-acc">Réponse expert</span>`:""}</div></div>
  <div class="right"><span class="stamp s-${f.statut}">${st[0]}</span><div class="gain ${g.total<0?"neg":""}">${f.kind==="info"?"—":(g.total>0?"+":"")+chf(g.total)}<small>${f.kind==="info"?"information":f.kind==="interet"?`risque IA évité ${chf(g.iaRisk)}`:"CHF · effet net"}</small></div></div></div>
  ${open?`<div class="fb">
    <dl class="kv"><dt>Constat</dt><dd>${esc(f.constat)}</dd>
    <dt>Pièces liées</dt><dd>${(f.pieces||[]).map(esc).join("<br>")||"—"}</dd>
    ${f.ecriture?`<dt>Écriture proposée</dt><dd class="mono">D ${f.ecriture.d} ${esc(ACCOUNTS[f.ecriture.d]||"")} / C ${f.ecriture.c} ${esc(ACCOUNTS[f.ecriture.c]||"")} : CHF ${chf(f.montantAjuste??f.montant)}</dd>`:""}
    ${f.kind!=="info"?`<dt>Calcul du moteur</dt><dd class="tab">Montant CHF ${chf(f.montantAjuste??f.montant)}${g.dBase?` · bénéfice imposable ${g.dBase>0?"+":"−"}${chf(Math.abs(g.dBase))}`:""}<br>IFD ${chf(g.ifd)} · ICC ${chf(g.icc)}${g.tva?` · TVA ${chf(g.tva)}`:""}${g.pp?` · impôt personnel actionnaire ${chf(g.pp)}`:""} → <b>${chf(g.total)}</b><br><span class="hint">Taux effectif ${S.d.canton} ${pct(rate())} dont IFD ${pct(P.ifdEff)}${f.kind==="pp"?` · taux marginal actionnaire ${pct(S.answers.Q_TMARG?.t??.3,0)}`:""}</span></dd>`:""}
    <dt>Base légale</dt><dd class="refs">${f.refs.map(refChip).join("")}${(f.ext||[]).map(x=>`<span class="ref ext" title="Paramètre de pratique, source primaire non chargée">${esc(x)}</span>`).join("")}</dd>
    ${f.motif?`<dt>Motif du rejet</dt><dd>${esc(f.motif)}</dd>`:""}</dl>
    <div id="ai-${f.id}">${S.aiNotes[f.id]||""}</div>
    ${needDouble&&f.statut==="proposee"?`<div class="banner crit">Risque élevé : double validation requise (comptable et fiscaliste).</div>`:""}

      <button class="btn sm primary" data-act="valider" data-f="${f.id}" type="button" ${needDouble&&!(f.dvC&&f.dvF)?"disabled":""}>Valider</button>
      ${f.kind!=="info"?`<span class="row"><input type="number" id="adj-${f.id}" value="${f.montantAjuste??f.montant}" style="width:130px" aria-label="Montant ajusté"><button class="btn sm" data-act="ajuster" data-f="${f.id}" type="button">Ajuster le montant</button></span>`:""}
      <button class="btn sm danger" data-act="rejeter" data-f="${f.id}" type="button">Rejeter</button>

  </article>`;
}
function totals(){
  const act=S.fiches.filter(isActive), prop=S.fiches;
  const sum=(L,k)=>L.reduce((a,f)=>a+gainOf(f)[k],0);
  return {prop:sum(prop,"total"), val:sum(act,"total"), nVal:act.length, nRej:S.fiches.filter(f=>f.statut==="rejetee").length, nOpen:S.fiches.filter(f=>f.statut==="proposee").length, risks:S.fiches.filter(f=>f.risque==="eleve").length};
}
function vValidation(){
  if(!S.fiches.length) return `<div class="lead"><div><h1>4. Validation</h1><p>Aucune fiche : lancez d’abord l’analyse.</p></div></div>`;
  const T=totals();
  return `<div class="lead"><div><h1>4. Validation par l’expert</h1><p>Fiches triées par gain décroissant puis par risque. Rien n’est comptabilisé ni déclaré sans validation ; un rejet exige un motif ; un risque élevé exige deux validations.</p></div>
  <div class="row"><button class="btn sm" id="openAll" type="button">Tout déplier</button><button class="btn sm" id="valAllLow" type="button">Valider tous les risques faibles</button></div></div>

    return `<div class="progress"><div class="row"><b>${done} / ${n} fiches traitées</b><span class="spacer"></span><span class="hint">${V.length} validée(s) · ${O.length} à traiter · ${R.length} rejetée(s)</span></div><div class="pbar"><i class="pv" style="width:${V.length/n*100}%"></i><i class="pr" style="width:${R.length/n*100}%"></i></div></div>
    <div class="zone zone-ok"><div class="zone-hd"><span class="stamp s-validee">✓ Validées</span><span class="hint">${V.length?`${V.length} fiche(s) · CHF ${chf(V.reduce((a,f)=>a+gainOf(f).total,0))}`:"Aucune fiche validée pour l’instant"}</span></div><div class="grid" id="fiches">${V.map(ficheCard).join("")}</div></div>

    <div class="grid">${O.map(ficheCard).join("")}</div>
    ${R.length?`<div class="zone"><div class="zone-hd"><span class="stamp s-rejetee">✕ Rejetées</span><span class="hint">${R.length} fiche(s), motif enregistré</span></div><div class="grid">${R.map(ficheCard).join("")}</div></div>`:""}`; })()}
  ${S.ecartees.length?`<section class="card"><div class="hd"><h2>Écartées par l’agent contrôleur</h2><span class="hint">Pas de base légale retrouvée = pas de proposition</span></div><div class="bd tablewrap"><table><tbody>${S.ecartees.map(f=>`<tr><td><b>${esc(f.titre)}</b><div class="hint">${esc(f.motif)}</div></td></tr>`).join("")}</tbody></table></div></section>`:""}
  <div class="row"><span class="spacer"></span><button class="btn primary" id="toRes" type="button">Voir les résultats</button></div>`;
}
function bValidation(){
  if(!S.fiches.length) return;
  const V=$("#view");
  V.querySelectorAll("[data-tog]").forEach(h=>{ const t=()=>{ S.open[h.dataset.tog]=!S.open[h.dataset.tog]; render(); const el=$("#card-"+h.dataset.tog); el&&el.scrollIntoView({block:"nearest"}); }; h.onclick=t; h.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); t(); } }; });
  V.querySelectorAll("[data-dv]").forEach(cb=>cb.onchange=()=>{ const f=S.fiches.find(x=>x.id===cb.dataset.f); if(cb.dataset.dv==="c") f.dvC=cb.checked; else f.dvF=cb.checked; audit(cb.dataset.dv==="c"?"Comptable":"Fiscaliste",cb.checked?"Visa":"Visa retiré",f.id); render(); });
  V.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{ const f=S.fiches.find(x=>x.id===b.dataset.f); const act=b.dataset.act;
    if(act==="valider"){ f.statut=f.montantAjuste!=null&&f.montantAjuste!==f.montant?"ajustee":"validee"; f.motif=null; audit("Comptable","Fiche validée",`${f.id} · ${f.titre}`); S.open[f.id]=false; nextOpen(); render(); flash(f.id); }
    if(act==="ajuster"){ const v=parseFloat($("#adj-"+f.id).value); if(isNaN(v)) return; f.montantAjuste=v; f.statut="ajustee"; audit("Comptable",`Montant ajusté ${chf(f.montant)} → ${chf(v)}`,f.id); render(); }
    if(act==="rejeter") askMotif(f);
    if(act==="expliquer") explainFiche(f,b);
  });
  $("#openAll").onclick=()=>{ const all=S.fiches.every(f=>S.open[f.id]); S.fiches.forEach(f=>S.open[f.id]=!all); render(); };
  $("#valAllLow").onclick=()=>{ S.fiches.filter(f=>f.risque==="faible"&&f.statut==="proposee").forEach(f=>{ f.statut="validee"; audit("Comptable","Fiche validée (lot risques faibles)",f.id); }); render(); };
  $("#toRes").onclick=()=>{ S.maxStep=5; S.step=5; render(); window.scrollTo(0,0); };

function byImpot(){

}

  const tw=(W-2*M-9)/4; tiles.forEach((t,i)=>{ const x=M+i*(tw+3); doc.setDrawColor(...line); doc.setFillColor(247,248,250); doc.roundedRect(x,52,tw,20,1.5,1.5,"FD"); doc.setFontSize(7.5); doc.setTextColor(...muted); doc.text(pdfTxt(t[0]),x+3,57.5); doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(...ink); doc.text(pdfTxt(t[1]),x+3,66.5); doc.setFont("helvetica","normal"); });

  const tbl=(h,body,opts={})=>{ doc.autoTable({startY:y,head:[h.map(pdfTxt)],body:body.map(rw=>rw.map(pdfTxt)),margin:{left:M,right:M},theme:"plain",styles:{font:"helvetica",fontSize:8.5,cellPadding:2,textColor:ink,lineColor:line,lineWidth:{bottom:.2}},headStyles:{fontStyle:"bold",textColor:muted,fontSize:7.5,fillColor:[247,248,250]},...opts}); y=doc.lastAutoTable.finalY+9; };

  head("Points à suivre pour la déclaration");
